[package]
name = "rkgrep"
version = "0.1.0"
edition = "2021"
description = "Ranked, span-scoped, budget-packed code search for a context window"
license = "MIT"
repository = "https://github.com/CoderDayton/rkgrep"
readme = "README.md"
keywords = ["grep", "search", "ripgrep", "code", "context"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rkgrep"
path = "src/main.rs"

[dependencies]
# ripgrep's own search engine, in-process: no subprocess, no serialization
# round-trip, and line numbers arrive as integers rather than parsed text.
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# Ground truth for the quality benchmark. Third-party parsers, so rkgrep's
# extractor is never scored against its own notion of a declaration.
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# Both benchmarks drive the release binary and `rg` as subprocesses and report
# aggregates over repeated trials, which criterion's sampling model does not
# express, so they bring their own harness.
[[bench]]
name = "quality"
harness = false

[[bench]]
name = "scaling"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
