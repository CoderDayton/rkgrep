[package]
name = "rkgrep"
version = "0.1.0"
edition = "2021"
# Set by `ignore` and `globset`, not by anything rkgrep itself writes. CI holds
# it to this.
rust-version = "1.88"
description = "Ranked, span-scoped, budget-packed code search for a context window"
license = "MIT"
repository = "https://github.com/CoderDayton/rkgrep"
readme = "README.md"
keywords = ["grep", "search", "ripgrep", "code", "context"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rkgrep"
path = "src/main.rs"

[dependencies]
# ripgrep's own search engine, in-process: no subprocess, no serialization
# round-trip, and line numbers arrive as integers rather than parsed text.
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Byte scans in the declaration scanners, which run on every matched line.
memchr = "2"
regex = "1"
# The splitter runs with a per-thread cache, which `regex` does not expose.
regex-automata = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Determinizes the split pattern; the binary only reads the result.
regex-automata = { version = "0.4", features = ["dfa-build"] }
# Decodes the published o200k_base ranks while building the token table. Only
# the built table ships; nothing here is linked into the binary.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Reference tokenizer, for the parity tests only. rkgrep's own counter has to
# agree with tiktoken token for token, and this is what proves it.
riptoken = "0.3"
rustc-hash = "2"
base64 = "0.22"
serde_json = "1"

# Ground truth for the quality benchmark. Third-party parsers, so rkgrep's
# extractor is never scored against its own notion of a declaration.
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# Both benchmarks drive the release binary and `rg` as subprocesses and report
# aggregates over repeated trials, which criterion's sampling model does not
# express, so they bring their own harness.
[[bench]]
name = "quality"
harness = false

[[bench]]
name = "scaling"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
